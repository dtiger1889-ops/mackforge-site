<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="1500" height="820" role="img" aria-label="Warhammer 40,000 Rogue Trader Hintforge companion status dossier">
  <!-- ============================================================
       ROGUE TRADER - Hintforge status card. Same skeleton as every
       Hintforge guide card; only the :root THEME block + text change.
       This one is a DARK theme (grimdark 40K) to show the skeleton
       handles dark palettes; ink is light-on-dark here.
       ============================================================ -->
  <style>
    :root{
      --paper:#1b1712; --paper-edge:#0e0c09; --ink:#dccca0; --ink-soft:#9a8c68;
      --primary:#a8862c; --primary-lt:#ccaa4e; --seg:#6e1f1a; --seg-dk:#3f120f;
      --cream:#ece0bc; --active:#7d9b63; --rule:#3a3327; --redact:#000000;
    }
    .mono{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;}
    .b{font-weight:700;}
    text{fill:var(--ink);}
    .tag{font-size:20px;letter-spacing:1px;}
    .tag-o{fill:var(--primary);}
    .soft{fill:var(--ink-soft);}
    .title{font-size:82px;letter-spacing:2px;fill:var(--ink);}
    .sub{font-size:26px;fill:var(--ink-soft);}
    .seclbl{font-size:25px;letter-spacing:1px;fill:var(--primary);}
    .cap{font-size:21px;fill:var(--ink-soft);}
    .seg{font-size:20px;letter-spacing:1px;fill:var(--cream);}
    .rlbl{font-size:23px;letter-spacing:1px;fill:var(--primary);}
    .rval{font-size:22px;fill:var(--ink);}
    .rval-mute{font-size:22px;fill:var(--ink-soft);}
    .foot{font-size:21px;fill:var(--ink-soft);}
    .stamp-t{font-size:42px;letter-spacing:3px;fill:var(--stamp,#8a2418);}
    .stamp-s{font-size:23px;letter-spacing:2px;fill:var(--stamp,#8a2418);}
  </style>

  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="80%">
      <stop offset="52%" stop-color="var(--paper)"/>
      <stop offset="100%" stop-color="var(--paper-edge)"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 0.04 0"/></filter>
    <filter id="worn"><feTurbulence type="fractalNoise" baseFrequency="0.04 0.06" numOctaves="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="6"/></filter>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="1500" height="820" fill="url(#vig)"/>
  <rect x="0" y="0" width="1500" height="820" filter="url(#grain)" opacity="0.55"/>

  <!-- double frame -->
  <rect x="38" y="38" width="1424" height="744" fill="none" stroke="var(--primary)" stroke-width="3"/>
  <rect x="47" y="47" width="1406" height="726" fill="none" stroke="var(--seg)" stroke-width="1"/>
  <g stroke="var(--primary)" stroke-width="3">
    <path d="M47 47 h26 M47 47 v26"/>
    <path d="M1453 47 h-26 M1453 47 v26"/>
    <path d="M47 773 h26 M47 773 v-26"/>
    <path d="M1453 773 h-26 M1453 773 v-26"/>
  </g>

  <!-- top tag row -->
  <text class="mono b tag tag-o" x="78" y="82">KORONUS EXPANSE</text>
  <text class="mono tag soft" x="330" y="82">//  FIELD DOSSIER</text>
  <text class="mono tag soft" x="1422" y="82" text-anchor="end">FILE No. HF-RT-001</text>
  <line x1="78" y1="100" x2="1422" y2="100" stroke="var(--seg)" stroke-width="1"/>

  <!-- title -->
  <text class="mono b title" x="78" y="200">ROGUE TRADER</text>
  <text class="mono sub" x="80" y="250">Warhammer 40,000 &#8212; a grimdark Owlcat CRPG (Russian studio)</text>

  <!-- coverage -->
  <text class="mono b seclbl" x="78" y="340">COVERAGE</text>
  <text class="mono cap" x="288" y="340">deep campaign &#8212; mechanics, crew, factions, items, achievements</text>
  <g>
    <rect x="78"   y="366" width="212" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="184"  y="399" text-anchor="middle">MECHANICS</text>
    <rect x="302"  y="366" width="212" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="408"  y="399" text-anchor="middle">CREW</text>
    <rect x="526"  y="366" width="212" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="632"  y="399" text-anchor="middle">FACTIONS</text>
    <rect x="750"  y="366" width="212" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="856"  y="399" text-anchor="middle">ITEMS</text>
    <rect x="974"  y="366" width="212" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="1080" y="399" text-anchor="middle">PUZZLES</text>
    <rect x="1198" y="366" width="224" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="1310" y="399" text-anchor="middle">ACHIEVEMENTS</text>
  </g>

  <!-- status rows -->
  <!-- VERIFIED (stale / partial) -->
  <circle cx="96" cy="470" r="10" fill="none" stroke="var(--primary-lt)" stroke-width="2"/>
  <path d="M96 460 A10 10 0 0 0 96 480 Z" fill="var(--primary-lt)"/>
  <text class="mono b rlbl" x="130" y="478">VERIFIED</text>
  <text class="mono rval" x="352" y="478">checked May 2026 (Build 21262645) &#8212; behind Patch 1.6 + Museion DLC</text>
  <line x1="78" y1="500" x2="1422" y2="500" stroke="var(--rule)" stroke-width="1"/>
  <!-- SPOILER CTRL -->
  <circle cx="96" cy="536" r="10" fill="var(--active)" stroke="#3f5030"/>
  <text class="mono b rlbl" x="130" y="544">SPOILER CTRL</text>
  <text class="mono rval" x="352" y="544">you set two dials &#8212; enemy (0-5) &amp; puzzle (0-3), both start silent</text>
  <line x1="78" y1="566" x2="1422" y2="566" stroke="var(--rule)" stroke-width="1"/>
  <!-- SAVE READER (full) -->
  <circle cx="96" cy="602" r="10" fill="var(--active)" stroke="#3f5030"/>
  <text class="mono b rlbl" x="130" y="610">SAVE READER</text>
  <text class="mono rval" x="352" y="610">ACTIVE &#8212; reads your saves &amp; resolved party/game state</text>
  <line x1="78" y1="632" x2="1422" y2="632" stroke="var(--rule)" stroke-width="1"/>
  <!-- TOOLS (not yet) -->
  <circle cx="96" cy="668" r="10" fill="var(--active)" stroke="#3f5030"/>
  <text class="mono b rlbl" x="130" y="676" fill="var(--ink-soft)">TOOLS</text>
  <text class="mono rval-mute" x="352" y="676">build planner built &#8212; rank ladder, 900 talents, save import; party planner next</text>

  <!-- fine print: save-reader spoiler caveat -->
  <path d="M90 700 l11 19 h-22 z" fill="none" stroke="var(--primary-lt)" stroke-width="1.5"/>
  <circle cx="90" cy="714" r="1.4" fill="var(--primary-lt)"/>
  <text class="mono foot" x="118" y="720" font-style="italic">Save reading is hard to spoiler-gate; any leak surfaces there, not in guide answers.</text>

  <!-- footer -->
  <text class="mono foot" x="78" y="762">github.com/hintforge/warhammer-40-000-rogue-trader</text>
  <text class="mono foot" x="1422" y="762" text-anchor="end">reads only the files you control</text>

  <!-- worn 'CHECKED' stamp (stale, not VERIFIED) -->
  <g transform="translate(1235 92) rotate(7)" opacity="0.85" filter="url(#worn)">
    <rect x="0" y="0" width="210" height="104" rx="12" fill="none" stroke="#8a2418" stroke-width="6"/>
    <rect x="12" y="12" width="186" height="80" rx="8" fill="none" stroke="#8a2418" stroke-width="2"/>
    <text class="mono b stamp-t" x="105" y="50" text-anchor="middle">CHECKED</text>
    <text class="mono b stamp-s" x="105" y="80" text-anchor="middle">MAY 2026</text>
  </g>
</svg>
