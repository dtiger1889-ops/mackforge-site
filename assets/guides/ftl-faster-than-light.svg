<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" width="1500" height="820" role="img" aria-label="FTL Faster Than Light Hintforge companion status card">
  <!-- FTL - Hintforge status card. DARK theme (deep space + cyan console);
       verification mark = a ship's-console SYSTEM READOUT, not a stamp. -->
  <style>
    :root{
      --paper:#0f151b; --paper-edge:#070a0e; --ink:#b9ccd2; --ink-soft:#7f929a;
      --primary:#3fa79a; --primary-lt:#5fc4b6; --seg:#1d454c; --seg-dk:#0e2a2f;
      --cream:#d6ecec; --active:#6fc48a; --rule:#22333a;
    }
    .mono{font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;}
    .b{font-weight:700;} text{fill:var(--ink);}
    .tag{font-size:20px;letter-spacing:1px;} .tag-o{fill:var(--primary);} .soft{fill:var(--ink-soft);}
    .title{font-size:82px;letter-spacing:8px;fill:var(--ink);}
    .sub{font-size:26px;fill:var(--ink-soft);}
    .seclbl{font-size:25px;letter-spacing:1px;fill:var(--primary);}
    .cap{font-size:21px;fill:var(--ink-soft);}
    .seg{font-size:19px;letter-spacing:1px;fill:var(--cream);}
    .rlbl{font-size:23px;letter-spacing:1px;fill:var(--primary);}
    .rval{font-size:22px;fill:var(--ink);} .rval-mute{font-size:22px;fill:var(--ink-soft);}
    .foot{font-size:21px;fill:var(--ink-soft);}
    .hud{fill:var(--primary);}
  </style>
  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="82%">
      <stop offset="50%" stop-color="var(--paper)"/><stop offset="100%" stop-color="var(--paper-edge)"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.5  0 0 0 0 0.54  0 0 0 0.04 0"/></filter>
  </defs>

  <rect x="0" y="0" width="1500" height="820" fill="url(#vig)"/>
  <rect x="0" y="0" width="1500" height="820" filter="url(#grain)" opacity="0.5"/>

  <rect x="38" y="38" width="1424" height="744" fill="none" stroke="var(--primary)" stroke-width="3"/>
  <rect x="47" y="47" width="1406" height="726" fill="none" stroke="var(--seg)" stroke-width="1"/>
  <g stroke="var(--primary)" stroke-width="3">
    <path d="M47 47 h26 M47 47 v26"/><path d="M1453 47 h-26 M1453 47 v26"/>
    <path d="M47 773 h26 M47 773 v-26"/><path d="M1453 773 h-26 M1453 773 v-26"/>
  </g>

  <text class="mono b tag tag-o" x="78" y="82">FEDERATION SHIP</text>
  <text class="mono tag soft" x="330" y="82">//  SYSTEMS MANIFEST</text>
  <text class="mono tag soft" x="1422" y="82" text-anchor="end">FILE No. HF-FTL-001</text>
  <line x1="78" y1="100" x2="1422" y2="100" stroke="var(--seg)" stroke-width="1"/>

  <text class="mono b title" x="78" y="200">FTL</text>
  <text class="mono sub" x="80" y="250">Faster Than Light &#8212; a spaceship-management roguelike</text>

  <text class="mono b seclbl" x="78" y="340">COVERAGE</text>
  <text class="mono cap" x="288" y="340">ship systems, crew, weapons, sectors &amp; achievements mapped</text>
  <g>
    <rect x="78"   y="366" width="259" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="207"  y="398" text-anchor="middle">MECHANICS</text>
    <rect x="349"  y="366" width="259" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="478"  y="398" text-anchor="middle">CREW</text>
    <rect x="620"  y="366" width="259" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="749"  y="398" text-anchor="middle">WEAPONS</text>
    <rect x="891"  y="366" width="259" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="1020" y="398" text-anchor="middle">FACTIONS</text>
    <rect x="1162" y="366" width="260" height="52" rx="6" fill="var(--seg)" stroke="var(--seg-dk)"/>
    <text class="mono b seg" x="1292" y="398" text-anchor="middle">ACHIEVEMENTS</text>
  </g>

  <circle cx="96" cy="470" r="10" fill="var(--active)" stroke="#3a7a52"/>
  <text class="mono b rlbl" x="130" y="478">VERIFIED</text>
  <text class="mono rval" x="352" y="478">vs the live game, June 2026 &#8212; stable (Advanced Edition)</text>
  <line x1="78" y1="500" x2="1422" y2="500" stroke="var(--rule)" stroke-width="1"/>

  <circle cx="96" cy="536" r="10" fill="var(--active)" stroke="#3a7a52"/>
  <text class="mono b rlbl" x="130" y="544">SPOILER CTRL</text>
  <text class="mono rval" x="352" y="544">you set two dials &#8212; enemy (0-5) &amp; puzzle (0-3), both start silent</text>
  <line x1="78" y1="566" x2="1422" y2="566" stroke="var(--rule)" stroke-width="1"/>

  <circle cx="96" cy="602" r="10" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="mono b rlbl" x="130" y="610" fill="var(--ink-soft)">SAVE READER</text>
  <text class="mono rval-mute" x="352" y="610">none &#8212; a corpus-fed guide (FTL's save is binary)</text>
  <line x1="78" y1="632" x2="1422" y2="632" stroke="var(--rule)" stroke-width="1"/>

  <circle cx="96" cy="668" r="10" fill="var(--active)" stroke="#3a7a52"/>
  <text class="mono b rlbl" x="130" y="676" fill="var(--ink-soft)">TOOLS</text>
  <text class="mono rval-mute" x="352" y="676">power planner built &#8212; reactor budget, per-system reference figures</text>

  <circle cx="90" cy="712" r="9" fill="none" stroke="var(--primary)" stroke-width="1.5"/>
  <text class="mono b" x="90" y="718" font-size="13px" text-anchor="middle" fill="var(--primary)">i</text>
  <text class="mono foot" x="118" y="720" font-style="italic">Answers come only from this guide's files &#8212; never guesswork or training data.</text>

  <text class="mono foot" x="78" y="762">github.com/hintforge/ftl-faster-than-light</text>
  <text class="mono foot" x="1422" y="762" text-anchor="end">reads only the files you control</text>

  <!-- SYSTEM READOUT (ship-console diagnostic, not a stamp) -->
  <g transform="translate(1206 100)">
    <rect x="0" y="0" width="236" height="106" rx="4" fill="#0c1519" stroke="var(--primary)" stroke-width="2"/>
    <line x1="0" y1="32" x2="236" y2="32" stroke="var(--primary)" stroke-width="1"/>
    <text class="mono b hud" x="12" y="23" font-size="14px" letter-spacing="1">SYS INTEGRITY</text>
    <circle cx="205" cy="17" r="5" fill="var(--active)"/>
    <text class="mono b hud" x="118" y="70" font-size="32px" letter-spacing="3" text-anchor="middle">VERIFIED</text>
    <text class="mono hud" x="118" y="92" font-size="15px" letter-spacing="2" text-anchor="middle">JUN 2026 &#183; SCAN OK</text>
  </g>
</svg>
